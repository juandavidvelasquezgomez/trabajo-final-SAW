<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Constancias · Eventos académicos</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header id="encabezado"></header>
  <main>
    <div class="no-imprimir">
      <h1>Constancias de asistencia</h1>
      <p class="sub">Disponibles cuando tu asistencia quedó registrada y el evento ya finalizó.</p>
      <div class="grid2">
        <form id="form-obtener" class="card" novalidate>
          <h2 style="margin-top:0;font-size:1.1rem">Obtener mi constancia</h2>
          <div style="display:grid;gap:12px">
            <div><label for="k-correo">Correo con el que te inscribiste</label><input id="k-correo" name="correo" type="email" required maxlength="254"></div>
            <div><label for="k-documento">Documento</label><input id="k-documento" name="documento" required minlength="5" maxlength="20"></div>
            <button class="btn" type="submit">Buscar constancias</button>
          </div>
          <div id="msg-obtener"></div>
        </form>
        <form id="form-verificar" class="card" novalidate>
          <h2 style="margin-top:0;font-size:1.1rem">Verificar una constancia</h2>
          <div style="display:grid;gap:12px">
            <div><label for="k-codigo">Código de verificación</label><input id="k-codigo" name="codigo" required maxlength="40" placeholder="EA-12-0000000000000000"></div>
            <button class="btn sec" type="submit">Verificar</button>
          </div>
          <div id="msg-verificar"></div>
        </form>
      </div>
    </div>
    <div id="resultados"></div>
  </main>
  <script type="module" src="js/constancia.js"></script>
</body>
</html>
